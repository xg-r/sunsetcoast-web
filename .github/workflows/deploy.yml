# main에 push하면 정적 빌드(out/) → S3 업로드 → CloudFront 캐시 무효화.
# AWS 준비와 저장소 변수 설정은 docs/deploy.md 참고.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'design/**'
      - 'docs/**'
      - 'mocks/**'
      - '**/*.md'
  workflow_dispatch:

# 배포가 겹치면 앞의 것을 끝까지 마치고 다음 것을 시작한다 (중간에 끊으면 S3가 반쯤 바뀐 상태로 남는다)
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # AWS OIDC 로그인 (액세스 키를 저장하지 않는다)
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://sunsetcoast.kr
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      # 백엔드가 아직 없으면 비워 둔다 (노을 시각 영역을 숨긴다)
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
    steps:
      - name: 설정 확인
        run: |
          missing=()
          for v in S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID AWS_ROLE_ARN; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::저장소 변수가 없습니다: ${missing[*]} (Settings → Secrets and variables → Actions → Variables, docs/deploy.md)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 사진 인코딩(AVIF/WebP)이 빌드 시간 대부분이다. 결과를 캐시해 바뀐 사진만 다시 만든다.
      - name: 이미지 캐시
        uses: actions/cache@v4
        with:
          path: |
            public/img
            public/og
          key: images-${{ hashFiles('photos/**', 'scripts/build-images.mjs') }}
          restore-keys: images-

      # src/generated/images.json(사진 목록)을 만든다. typecheck가 이 파일을 import하므로 먼저 돌린다.
      # 이미 있는 사진은 건너뛰므로 build에서 한 번 더 돌아도 금방 끝난다.
      - run: npm run images

      - run: npm run typecheck

      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: S3 업로드 + CloudFront 무효화
        run: bash scripts/deploy-s3.sh
